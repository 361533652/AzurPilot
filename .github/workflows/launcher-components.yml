name: Rebuild launcher components

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Notify launcher CI of backend changes
        env:
          GH_TOKEN: ${{ secrets.LAUNCHER_DISPATCH_TOKEN }}
          SOURCE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo '::notice::Set LAUNCHER_DISPATCH_TOKEN to rebuild immediately; launcher CI also checks every six hours.'
            exit 0
          fi
          jq -n --arg revision "$SOURCE_REVISION" '{event_type:"runtime-components",client_payload:{revision:$revision}}' \
            | gh api repos/wess09/AzurPilotLauncher/dispatches --input -
